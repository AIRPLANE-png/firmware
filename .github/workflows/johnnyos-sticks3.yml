name: JohnnyOS StickS3 Cloud Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/johnnyos-sticks3.yml'
      - 'src/**'
      - 'include/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'build.py'
      - 'JOHNNYOS_FLASHING.md'

# Keep only the newest requested firmware build to avoid resource contention.
concurrency:
  group: johnnyos-sticks3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sticks3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout firmware with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PlatformIO and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio requests esptool intelhex

      - name: Compile StickS3 firmware
        run: |
          set -o pipefail
          pio run -e m5stack-sticks3 2>&1 | tee sticks3-build.log

      - name: Validate complete JohnnyOS flash image
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          image = Path("JohnnyOS-m5stack-sticks3.bin")
          assert image.is_file(), "Full merged image was not generated"
          n = image.stat().st_size
          assert 0 < n <= 8 * 1024 * 1024, f"Image outside 8MB limit: {n}"
          print(f"JohnnyOS merged ESP32-S3 flash image: {n:,} bytes")
          print("FLASH THE COMPLETE IMAGE AT OFFSET 0x0000")
          PY

      - name: Upload tested-build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JohnnyOS-StickS3-UI-Refresh-v0.3
          path: |
            JohnnyOS-m5stack-sticks3.bin
            JOHNNYOS_FLASHING.md
            sticks3-build.log
          if-no-files-found: error
          retention-days: 14
